name: app

on:
  pull_request:
    paths:
      - "app/**"
      - "backend/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rq_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RQ_PYTHON: python
      # CI-only throwaway database; the schema is reset by e2e/start-backend.sh
      RQ_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rq_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            app/e2e/sim/requirements.txt
      - run: npm ci
      - run: pip install ../backend -r e2e/sim/requirements.txt
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests (protobuf + Security 1 client vs device simulator)
        run: npm test
      - name: E2E (backend + simulator + PWA in Chromium)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
            app/e2e/.backend.log
          retention-days: 7
