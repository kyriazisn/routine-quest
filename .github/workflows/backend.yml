name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RQ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - name: Lint
        run: ruff check app tests migrations && ruff format --check app tests migrations
      - name: Tests (PostgreSQL 16, migrated with Alembic)
        run: pytest -p no:warnings
      - name: Migration drift check
        env:
          RQ_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rq_test
        run: alembic check

  image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t routine-quest-backend:${{ github.sha }} backend
